security:
    password_hashers:
        App\Infrastructure\Security\AdministratorSecurityUser:
            id: App\Infrastructure\Security\NativeArgon2IdAdministratorPasswordHasher

    providers:
        administrators:
            id: App\Infrastructure\Security\AdministratorUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: administrators
            form_login:
                login_path: admin_login
                check_path: admin_login
                username_parameter: login_id
                password_parameter: password
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
                default_target_path: admin_dashboard
            two_factor:
                auth_form_path: admin_2fa
                check_path: admin_2fa_check
                post_only: true
                auth_code_parameter_name: _auth_code
                default_target_path: admin_dashboard
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: two_factor
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: logout

    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_ADMINISTRATOR }
