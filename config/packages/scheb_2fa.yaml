# The bundle's built-in TOTP provider is disabled because administrators use the custom DB-backed provider.
scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
    totp:
        enabled: false
    trusted_device:
        enabled: '%env(TRUSTED_DEVICE_ENABLED)%'
        lifetime: 2592000
        extend_lifetime: false
        cookie_name: StreamNotifyBotTrusted
        cookie_secure: auto
        cookie_path: /
        cookie_same_site: strict

when@prod:
    scheb_two_factor:
        trusted_device:
            cookie_name: __Host-StreamNotifyBotTrusted
            cookie_secure: true
