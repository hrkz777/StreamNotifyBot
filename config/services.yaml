# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    _instanceof:
        App\Domain\Catalog\PlatformAccountResolver:
            tags: ['app.platform_account_resolver']
        App\Domain\Subscription\WebhookSubscriptionRequester:
            tags: ['app.webhook_subscription_requester']

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Domain\System\DatabaseConnectionProbe:
        alias: App\Infrastructure\Persistence\DoctrineDatabaseConnectionProbe

    App\Domain\System\Clock:
        alias: App\Infrastructure\System\SystemClock

    App\Domain\System\IdGenerator:
        alias: App\Infrastructure\System\SymfonyUuidV7Generator

    App\Domain\System\IntegerRandomizer:
        alias: App\Infrastructure\System\CryptographicIntegerRandomizer

    App\Domain\System\LeaseTokenGenerator:
        alias: App\Infrastructure\System\CryptographicLeaseTokenGenerator

    App\Domain\System\OperationalSettingRepository:
        alias: App\Infrastructure\Persistence\DoctrineOperationalSettingRepository

    App\Domain\Catalog\AgencyRepository:
        alias: App\Infrastructure\Persistence\DoctrineAgencyRepository

    App\Domain\Catalog\StreamerCatalogRepository:
        alias: App\Infrastructure\Persistence\DoctrineStreamerCatalogRepository

    App\Domain\Catalog\PlatformApiCredentialRepository:
        alias: App\Infrastructure\Persistence\DoctrinePlatformApiCredentialRepository

    App\Application\Catalog\PlatformApiCredentialConfigurationLoader:
        alias: App\Application\Catalog\LoadPlatformApiCredential

    App\Domain\Subscription\WebhookSubscriptionRepository:
        alias: App\Infrastructure\Persistence\DoctrineWebhookSubscriptionRepository

    App\Domain\Subscription\WebhookEventRepository:
        alias: App\Infrastructure\Persistence\DoctrineWebhookEventRepository

    App\Domain\Stream\PlatformVideoRepository:
        alias: App\Infrastructure\Persistence\DoctrinePlatformVideoRepository

    App\Domain\Stream\StreamNotificationOutboxRepository:
        alias: App\Infrastructure\Persistence\DoctrineStreamNotificationOutboxRepository

    App\Domain\Subscription\WebhookSubscriptionRequestDispatcher:
        alias: App\Infrastructure\Platform\WebhookSubscriptionRequesterRegistry

    App\Domain\Job\JobPolicyRepository:
        alias: App\Infrastructure\Persistence\DoctrineJobPolicyRepository

    App\Domain\Administration\AdministratorRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorRepository

    App\Domain\Administration\AuditLogRepository:
        alias: App\Infrastructure\Persistence\DoctrineAuditLogRepository

    App\Domain\Administration\AuthenticationPolicyRepository:
        alias: App\Infrastructure\Persistence\DoctrineAuthenticationPolicyRepository

    App\Domain\Administration\AuthenticationAttemptRepository:
        alias: App\Infrastructure\Persistence\AuditedAuthenticationAttemptRepository

    App\Domain\Administration\AdministratorTokenRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorTokenRepository

    App\Domain\Administration\AdministratorInvitationRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorInvitationRepository

    App\Domain\Administration\AdministratorInvitationAcceptanceRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorInvitationAcceptanceRepository

    App\Domain\Administration\AdministratorDeactivationRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorDeactivationRepository

    App\Domain\Administration\AdministratorDeletionRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorDeletionRepository

    App\Domain\Administration\AdministratorSetupTokenGenerator:
        alias: App\Infrastructure\Security\CryptographicAdministratorSetupTokenGenerator

    App\Domain\Administration\AdministratorTotpCredentialRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorTotpCredentialRepository

    App\Domain\Administration\AdministratorTotpAlgorithm:
        alias: App\Infrastructure\Security\OtpPhpAdministratorTotpAlgorithm

    App\Domain\Administration\AdministratorTotpVerifier:
        alias: App\Application\Administration\VerifyAdministratorTotp

    App\Domain\Administration\AdministratorTotpCredentialReencryptor:
        alias: App\Application\Administration\ReencryptAdministratorTotpCredentials

    App\Domain\Administration\AdministratorRecoveryCodeRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorRecoveryCodeRepository

    App\Domain\Administration\AdministratorRecoveryCodeAlgorithm:
        alias: App\Infrastructure\Security\NativeAdministratorRecoveryCodeAlgorithm

    App\Domain\Administration\AdministratorTotpEnrollmentRepository:
        alias: App\Infrastructure\Persistence\DoctrineAdministratorTotpEnrollmentRepository

    App\Domain\Administration\InitialOwnerRepository:
        alias: App\Infrastructure\Persistence\DoctrineInitialOwnerRepository

    App\Domain\Administration\SoleOwnerCredentialRecoveryRepository:
        alias: App\Infrastructure\Persistence\AuditedSoleOwnerCredentialRecoveryRepository

    App\Domain\Administration\CommonPasswordChecker:
        alias: App\Infrastructure\Security\FileCommonPasswordChecker

    App\Domain\Administration\AdministratorPasswordHasher:
        alias: App\Infrastructure\Security\NativeArgon2IdAdministratorPasswordHasher

    App\Domain\Security\EncryptionKeyRing:
        alias: App\Infrastructure\Security\JsonFileEncryptionKeyRing

    App\Domain\Security\SecretCipher:
        alias: App\Infrastructure\Security\SodiumSecretCipher

    App\Infrastructure\Security\AdministratorTwoFactorProvider:
        tags:
            - { name: scheb_two_factor.provider, alias: administrator_totp }

    App\Presentation\Admin\AdminNavigationExtension:
        tags: ['twig.extension']

    app.session.handler:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        arguments:
            $pdoOrDsn: '%env(resolve:DATABASE_URL)%'
            $options:
                db_table: framework_sessions
                ttl: 1800

    App\Infrastructure\Security\FileCommonPasswordChecker:
        arguments:
            $passwordListPath: '%kernel.project_dir%/resources/security/common-passwords.txt'

    App\Infrastructure\Security\JsonFileEncryptionKeyRing:
        arguments:
            $keyRingFilePath: '%env(SECRET_KEY_RING_FILE)%'

    App\Domain\Catalog\PlatformAccountLookup:
        alias: App\Infrastructure\Platform\PlatformAccountResolverRegistry

    App\Infrastructure\Platform\PlatformAccountResolverRegistry:
        arguments:
            $resolvers: !tagged_iterator app.platform_account_resolver

    App\Infrastructure\Platform\WebhookSubscriptionRequesterRegistry:
        arguments:
            $requesters: !tagged_iterator app.webhook_subscription_requester

    App\Infrastructure\Platform\YouTube\YouTubePlatformAccountResolver:
        arguments: { $httpClient: '@http_client.transport' }

    App\Infrastructure\Platform\YouTube\YouTubeVideoDetailsFetcher:
        arguments: { $httpClient: '@http_client.transport' }

    App\Infrastructure\Platform\YouTube\YouTubeVideoDetailsProvider: '@App\Infrastructure\Platform\YouTube\YouTubeVideoDetailsFetcher'

    App\Infrastructure\Platform\YouTube\YouTubeChannelFeedProvider: '@App\Infrastructure\Platform\YouTube\YouTubeChannelFeedFetcher'

    App\Infrastructure\Platform\YouTube\YouTubeWebSubSubscriptionRequester:
        arguments:
            $httpClient: '@http_client.transport'
            $defaultUri: '%env(DEFAULT_URI)%'

    App\Infrastructure\Platform\Twitch\TwitchAccessTokenProvider:
        alias: App\Infrastructure\Platform\Twitch\TwitchClientCredentialsTokenProvider

    App\Infrastructure\Platform\Twitch\TwitchClientCredentialsTokenProvider:
        arguments: { $httpClient: '@http_client.transport' }

    App\Infrastructure\Platform\Twitch\TwitchStreamStatusFetcher:
        arguments: { $httpClient: '@http_client.transport' }

    App\Infrastructure\Platform\Twitch\TwitchStreamStatusProvider: '@App\Infrastructure\Platform\Twitch\TwitchStreamStatusFetcher'

    App\Application\Subscription\TwitchStreamSynchronizer: '@App\Application\Subscription\SyncTwitchStreams'

    App\Infrastructure\Platform\Twitch\TwitchPlatformAccountResolver:
        arguments: { $httpClient: '@http_client.transport' }

    App\Infrastructure\Platform\TwitCasting\TwitCastingPlatformAccountResolver:
        arguments: { $httpClient: '@http_client.transport' }

    App\Infrastructure\Platform\TwitCasting\TwitCastingLiveStatusFetcher:
        arguments: { $httpClient: '@http_client.transport' }

    App\Infrastructure\Platform\TwitCasting\TwitCastingLiveStatusProvider: '@App\Infrastructure\Platform\TwitCasting\TwitCastingLiveStatusFetcher'

    App\Application\Subscription\TwitCastingStreamSynchronizer: '@App\Application\Subscription\SyncTwitCastingStreams'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
