name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start development environment
        run: docker compose up --build --detach --wait

      - name: Apply database migrations
        run: |
          docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction
          docker compose exec -T app php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run quality checks
        run: docker compose exec -T app composer check

      - name: Validate Composer configuration and dependencies
        run: |
          docker compose exec -T app composer validate --strict
          docker compose exec -T app composer check-platform-reqs
          docker compose exec -T app composer audit --locked --no-dev

      - name: Verify MariaDB connection
        run: docker compose exec -T app php bin/console app:database:check

      - name: Verify HTTP health endpoint
        run: test "$(curl --fail --show-error --silent http://127.0.0.1:8080/health)" = '{"status":"ok"}'

      - name: Build production image
        run: docker build --target production --tag streamnotifybot-app:production .

      - name: Verify production image contents
        run: |
          docker run --rm --entrypoint sh streamnotifybot-app:production -lc \
            'test ! -e /var/www/html/tests && \
             test ! -e /var/www/html/phpunit.dist.xml && \
             test ! -d /var/www/html/vendor/phpunit && \
             test -f /var/www/html/LICENSE'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop environment
        if: always()
        run: docker compose down --volumes
