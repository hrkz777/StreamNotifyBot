services:
  app:
    build:
      context: .
      target: development
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: local-development-only
      DATABASE_URL: mysql://streamnotifybot:local-development-only@database:3306/streamnotifybot?serverVersion=10.5.29-MariaDB&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:10.5.29
    environment:
      MARIADB_DATABASE: streamnotifybot
      MARIADB_USER: streamnotifybot
      MARIADB_PASSWORD: local-development-only
      MARIADB_RANDOM_ROOT_PASSWORD: 1
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --transaction-isolation=READ-COMMITTED
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database-data:/var/lib/mysql

volumes:
  database-data:
